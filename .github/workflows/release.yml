name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test and package release
        run: ./gradlew --no-daemon clean test packageRelease

      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          JAR="build/release/ItemGuard-${VERSION}.jar"
          SHA="build/release/ItemGuard-${VERSION}.sha256"
          MANIFEST="build/release/RELEASE-MANIFEST.json"
          NOTES="RELEASE-NOTES-${VERSION}.md"
          if [ ! -f "$JAR" ] || [ ! -f "$SHA" ] || [ ! -f "$MANIFEST" ] || [ ! -f "$NOTES" ]; then
            echo "Missing release files for ${VERSION}" >&2
            ls -la build/release || true
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$JAR" "$SHA" "$MANIFEST" --clobber
          else
            gh release create "$TAG" \
              --title "ItemGuard ${VERSION}" \
              --notes-file "$NOTES" \
              --prerelease \
              --verify-tag \
              "$JAR" "$SHA" "$MANIFEST"
          fi
