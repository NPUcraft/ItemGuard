# Player current risk is MAX(active incident scores), not the sum of every unexpired signal.
# Related evidence can combine inside one incident. Unrelated incidents never stack.
# Missing keys use in-memory defaults. Existing operator files are never overwritten.

scores:
  UNEXPLAINED_ITEM_GAIN: 35
  HIGH_VALUE_ITEM_BURST: 20
  RARE_ITEM_BURST: 20
  REPEATED_IDENTICAL_ITEMS: 15
  RAPID_ITEM_GAIN: 10
  SHULKER_HIGH_FLOW: 10
  SHULKER_RAPID_TRANSFER: 0
  ILLEGAL_ENCHANTMENT: 40
  OVER_LEVEL_ENCHANTMENT: 40
  CONFLICTING_ENCHANTMENTS: 10
  OVERSIZED_STACK: 45
  SUSPICIOUS_ATTRIBUTE: 15
  SUSPICIOUS_COMPONENT: 12
  COMPONENT_MODIFIED: 0
  CUSTOM_ITEM_METADATA: 0
  ABNORMAL_DURABILITY: 25
  SUSPICIOUS_CONTAINER_CONTENTS: 18
  CUSTOM_MAX_STACK: 0
  HUSKSYNC_DATA_APPLY: 0
  KNOWN_CONTAINER_SOURCE: 0
  # Reserved for 1.1+ cross-server heuristics. Unused in 1.0 detectors.
  HUSKSYNC_REPEATED_SYNC: 8
  HUSKSYNC_ROLLBACK_LIKE: 15
  HUSKSYNC_RAPID_RESTORE: 12
  DUPLICATE_FINGERPRINT: 25

# high (60) is the default admin-alert threshold. ItemGuard alerts first and never auto-punishes.
levels:
  suspicious: 30
  high: 60
  critical: 80

windows:
  rapid-gain-millis: 5000
  high-value-burst-millis: 10000
  repeated-identical-millis: 30000
  shulker-flow-millis: 10000
  # Fallback expiry for a produced signal object. Incident TTLs below are the live score window.
  signal-ttl-millis: 120000

thresholds:
  rapid-gain-amount: 256
  high-value-burst-score: 400
  repeated-identical-amount: 128
  shulker-high-flow-transfers: 24
  shulker-rapid-transfer-millis: 750
  unexplained-min-amount: 1

incidents:
  item-gain-ttl-seconds: 20
  illegal-item-ttl-seconds: 120
  suspicious-item-ttl-seconds: 120
  shulker-ttl-seconds: 15
  max-active-per-player: 16
  # Related ITEM_GAIN evidence can join only inside this wave window. Later chest/pickup of the same material starts a new incident.
  item-gain-join-millis: 2000

# UNKNOWN is attribution state. These scores are driven by item value and amount.
unknown-gain:
  low-value-max: 5
  high-value-min: 20
  extreme-value-min: 50
  low-score: 3
  medium-score: 10
  high-score: 25
  extreme-score: 35
  weighted-high: 800
  weighted-critical: 4000

detectors:
  high-value-burst-minimum-item-value: 20
  repeated-identical-minimum-item-value: 20
  rapid-low-value-max-item-value: 5
  rapid-low-value-score: 3
  shulker-gate-minimum-item-value: 20

cooldowns:
  same-signal-millis: 8000
  alert-millis: 10000

deduplicate-same-correlation: true

# Same custom-item facts share one cap per correlation. Default scores for those facts are 0.
family-caps:
  custom-metadata: 10
